name: guardrails
on:
  pull_request:
  push:
    branches: [qa, main, "integration/**"]
jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Boundary rules (names)
        run: node scripts/check-boundaries.mjs
      - name: Import rules
        run: |
          d=""; for x in apps packages; do if [ -d "$x" ]; then d="$d $x"; fi; done
          if [ -z "$d" ]; then echo "SKIPPED: apps/ and packages/ do not exist yet"; exit 0; fi
          npx depcruise --config .dependency-cruiser.cjs $d 2>&1 | tee /tmp/cruise.log; ! grep -q missing-tsc-transpiler /tmp/cruise.log
      - name: Check-weakening scan
        if: github.event_name == 'pull_request'
        run: bash scripts/check-test-weakening.sh origin/${{ github.base_ref }}
      - name: Typecheck and tests
        run: npm run typecheck && npm test
      - name: Isolation build (each extension alone)
        run: |
          for app in sentinel cadence closeout; do bash scripts/check-isolation.sh "$app"; done
